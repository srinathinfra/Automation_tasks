; ==========================================================================
;  config.ini  -  fill this in once, then forget about it
;  Anything marked CHANGE ME needs your values before the first run.
; ==========================================================================

[jira]
; CHANGE ME - your Jira URL, no trailing slash
base_url = https://yourcompany.atlassian.net

; "cloud"  -> *.atlassian.net, authenticates with email + API token
; "server" -> self-hosted Jira Server or Data Center, uses a Personal Access Token
deployment = cloud

; CHANGE ME - only needed when deployment = cloud. Leave blank for server.
email = you@yourcompany.com

; CHANGE ME - Cloud: API token from id.atlassian.com/manage-profile/security/api-tokens
;             Server: Personal Access Token from your Jira profile
; Safer alternative: leave this blank and set a JIRA_API_TOKEN environment
; variable instead, so the secret never sits in a file.
api_token =

; Set to false only if your company proxy breaks SSL verification.
verify_ssl = true


[timesheet]
; The number your Jira board is supposed to show for a full day.
target_hours_per_day = 8

work_days = MON, TUE, WED, THU, FRI

; Company holidays and PTO - these days get a target of 0 so they never
; show up as gaps. Format YYYY-MM-DD, comma separated.
holidays =

; Suggested hours are rounded to this many minutes. 15 keeps things tidy.
round_to_minutes = 15

; OPTIONAL - the ticket you normally book meeting time against, e.g. an
; internal "Team Meetings" or "Ceremonies" ticket. If you leave it blank the
; Upload Template highlights those cells in yellow for you to fill in.
default_meeting_issue =

; OPTIONAL - a fallback ticket for leftover hours that are not meetings.
default_work_issue =


[outlook]
; CHANGE ME - where you saved the calendar export from Outlook.
; Windows paths are fine as-is, no need to double the backslashes here.
csv_path = C:\Users\yourname\Documents\calendar.csv

; auto | us | eu   - auto inspects the file and works it out itself.
; Force it to "us" or "eu" only if the dates come out obviously wrong.
date_format = auto

skip_all_day = true
skip_free = true

; Meetings you have not accepted yet. Off by default - you probably still
; attended most of them.
skip_tentative = false
skip_cancelled = true

; Ignore anything shorter than this, so 1-minute stubs do not clutter things.
min_meeting_minutes = 5

; Case-insensitive substrings. Any meeting whose subject contains one of
; these is dropped - useful for self-blocked focus time and lunch holds.
exclude_subjects = Lunch, Focus Time, Hold, Block, Do Not Book, OOO


[output]
; Where the report gets written. Leave blank to drop it next to the script.
excel_path = C:\Users\yourname\Documents\timesheet_gaps.xlsx
